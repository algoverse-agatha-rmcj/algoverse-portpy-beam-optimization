name: Lightweight checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python3 -m compileall -q .
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
